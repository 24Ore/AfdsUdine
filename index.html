<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gestione Donazione Plasma - AFDS</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { 
    font-family: Arial, sans-serif; 
    background: linear-gradient(135deg, #fff9c4, #fbc02d); 
    margin: 0; 
    padding: 2vh 5vw 0 5vw; /* Tolto padding inferiore per far aderire la fascia bianca */
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    min-height: 100vh; 
    text-align: center; 
  }
  h1 { 
    margin: 1vh 0 2vh 0;
    font-family: 'Pacifico', cursive; 
    font-size: clamp(2.5em, 8vw, 4em); 
    background: linear-gradient(45deg, #b8860b, #998a07); 
    -webkit-background-clip: text; 
    -webkit-text-fill-color: transparent; 
    font-weight: bold; 
  }
  .container { 
    display: flex; 
    justify-content: center; 
    flex-wrap: wrap; 
    gap: 3vw; 
    margin-bottom: 4vh; 
    width: 100%; 
    max-width: 1200px; 
    padding: 0 2vw; 
  }
  .quadrant { 
    background-color: white; 
    padding: 3vh 3vw; 
    border-radius: 1em; 
    box-shadow: 0 0.5em 1em rgba(0,0,0,0.1); 
    width: min(90%, 300px); 
    min-height: 20vh; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
  }
  .title { 
    font-weight: bold; 
    font-size: clamp(1em, 3vw, 1.5em); 
    margin-bottom: 1.2vh; 
    color: #555; 
  }
  .value { 
    display: flex; 
    align-items: baseline; 
    justify-content: center; 
    gap: 0.5em; 
    font-size: clamp(2em, 6vw, 3em); 
    color: #2c3e50; 
  }
  .unit { 
    font-size: 0.6em; 
    margin-left: 0.3em; 
  }
  
  /* Barra azioni: pulsanti perfettamente centrati */
  .action-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    width: 100%;
    max-width: 1200px;
    margin: 2vh auto;
    min-height: 120px;
  }
  
  /* Contenitore centrale pulsanti */
  .buttons-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5vh;
  }
  #plasmaBtn { 
    background-color: #b8860b; 
    color: white; 
    border: none; 
    padding: 1.8vh 3vw; 
    font-size: clamp(1.3em, 4vw, 1.8em); 
    border-radius: 0.5em; 
    cursor: pointer; 
    transition: all 0.3s; 
    font-family: 'Pacifico', cursive; 
    box-shadow: 0 4px 15px rgba(184, 134, 11, 0.3); 
    white-space: nowrap;
  }
  #plasmaBtn:hover { background-color: #998a07; transform: scale(1.02); }
  .icon-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  #exportBtn, #mailBtn, #direttaBtn {
    background-color: #2c3e50;
    color: white;
    border: none;
    padding: 1.2vh 2vw;
    font-size: 1.1em;
    border-radius: 0.5em;
    cursor: pointer;
    transition: all 0.3s;
    font-weight: bold;
  }
  #mailBtn { background-color: #2980b9; }
  #direttaBtn { background-color: #8e44ad; }
  .bottom-actions {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 5px;
  }
  #reduceBtn { background: none; border: none; font-size: 1.8rem; cursor: pointer; padding: 5px; }
  #resetBtn { background-color: #c0392b; color: white; border: none; padding: 0.8vh 2vw; font-size: 0.9em; border-radius: 0.5em; cursor: pointer; opacity: 0.8; }
  
  /* Sezione Patrocini - Fascia a larghezza intera */
  .sponsors-section { 
    width: 100vw; /* Usa 100vw per ignorare il padding laterale del body */
    background-color: #ffffff; /* Sfondo spostato qui */
    padding: 2vh 20px 1vh 20px; 
    margin-top: auto; 
    box-shadow: 0 -4px 15px rgba(0,0,0,0.05); 
  }

  /* Rimosso lo stile a "scatola" per lasciare spazio fluido */
  .logo-container-white {
    width: 100%;
    margin-bottom: 1vh;
  }
  
  .patrocinio-txt { 
    font-weight: bold; 
    font-size: 0.75em; 
    margin-bottom: 12px; 
    color: #444; 
    letter-spacing: 1px; 
  }
  
  /* Loghi tutti in riga */
  .logo-row-inline { 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    flex-wrap: wrap; 
    gap: 2.5vw; /* Gap leggermente aumentato */
  }
  
  /* Loghi ingranditi */
  .logo-img { height: clamp(45px, 6.5vh, 65px); width: auto; object-fit: contain; }
  .logo-fvg { height: clamp(40px, 5.5vh, 55px); } 

  .footer-small { 
    font-size: clamp(0.7em, 2vw, 0.9em); 
    color: #777; 
    margin-top: 8px;
    padding-bottom: 1vh;
  }
  
  @media (max-width: 768px) {
    .action-bar {
      flex-direction: column;
      min-height: auto;
      gap: 20px;
    }
    body {
      padding: 2vh 0 0 0; /* Rimuove padding per far coprire lo schermo alla fascia bianca */
    }
    .container {
      padding: 0 3vw;
    }
    #plasmaBtn {
      white-space: normal;
    }
    .logo-row-inline { gap: 15px; }
    .sponsors-section { padding: 15px 10px; }
  }
</style>
</head>
<body>

<h1>Pannello Gestione Plasma</h1>

<div class="container">
  <div class="quadrant"><div class="title">Numero Donatori</div><div class="value" id="persone">0</div></div>
  <div class="quadrant"><div class="title">Donazioni Plasma</div><div class="value" id="donazioni">0</div></div>
  <div class="quadrant">
    <div class="title">Plasma donato</div>
    <div class="value"><span id="litriNumero">0,00</span><span class="unit">litri</span></div>
    <div style="font-size:1em; margin-top:1vh;">(<span id="millilitri">0</span> ml)</div>
  </div>
</div>

<div class="action-bar">
  <div class="buttons-container">
    <button id="plasmaBtn">DONA PLASMA</button>
    <div class="icon-buttons">
      <button id="exportBtn" title="Scarica Excel">📥</button>
      <button id="mailBtn" title="Invia Email">✉️</button>
      <button id="direttaBtn" title="Vai alla Diretta">📺</button>
    </div>
    <div class="bottom-actions">
      <button id="reduceBtn" title="Riduci di 1 donazione">😊</button>
      <button id="resetBtn">🔄</button>
    </div>
  </div>
</div>

<div class="sponsors-section">
  <div class="logo-container-white">
    <div class="patrocinio-txt">CON IL PATROCINIO DI</div>
    
    <div class="logo-row-inline">
      <img src="EP_Logo Patronage_Europea_POS_RGB_IT.jpg" alt="Parlamento Europeo" class="logo-img">
      <img src="logo stemma comune udine 2025.jpg" alt="Comune di Udine" class="logo-img">
      <img src="logo Città Sane Udine.jpg" alt="Città Sane" class="logo-img">
      <img src="Logo Regione autonoma FVG.png" alt="Regione FVG" class="logo-img logo-fvg">
      <img src="ASU FC FVG colore@4x.png" alt="ASU FC" class="logo-img">
      <img src="LOGOCRFVG.JPG" alt="Consiglio Regionale FVG" class="logo-img">
    </div>
  </div>
  
  <div class="footer-small">Tutti i diritti sono riservati. AFDS Udine.</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA2tJ9eX3BZ9UkJa_ikglNesBgTejCSM2k",
    authDomain: "afds-24ore.firebaseapp.com",
    databaseURL: "https://afds-24ore-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "afds-24ore",
    storageBucket: "afds-24ore.firebasestorage.app",
    messagingSenderId: "1019493137119",
    appId: "1:1019493137119:web:e6dc7238513814a064876a",
    measurementId: "G-3N241MBCMR"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const dataRef = ref(db, 'stats');

  let currentData = { persone: 0, donazioni: 0, litri: 0, milli: 0 };

  onValue(dataRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
      currentData = data;
      updateUI();
    }
  });

  function updateUI() {
    document.getElementById('persone').textContent = currentData.persone;
    document.getElementById('donazioni').textContent = currentData.donazioni;
    document.getElementById('litriNumero').textContent = currentData.litri.toFixed(2).replace('.', ',');
    document.getElementById('millilitri').textContent = currentData.milli;
  }

  document.getElementById('plasmaBtn').addEventListener('click', () => {
    set(dataRef, {
      persone: currentData.persone + 1,
      donazioni: currentData.donazioni + 1,
      litri: currentData.litri + 0.75,
      milli: currentData.milli + 750
    });
  });

  document.getElementById('reduceBtn').addEventListener('click', () => {
    if (currentData.donazioni > 0 && confirm("Rimuovere l'ultima donazione?")) {
      set(dataRef, {
        persone: Math.max(0, currentData.persone - 1),
        donazioni: Math.max(0, currentData.donazioni - 1),
        litri: Math.max(0, currentData.litri - 0.75),
        milli: Math.max(0, currentData.milli - 750)
      });
    }
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm("Azzerare tutto?")) {
      set(dataRef, { persone: 0, donazioni: 0, litri: 0, milli: 0 });
    }
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    const reportData = [["REPORT PLASMA"], ["Donatori", currentData.persone], ["Donazioni", currentData.donazioni], ["Litri", currentData.litri.toFixed(2)]];
    const worksheet = XLSX.utils.aoa_to_sheet(reportData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Dati");
    XLSX.writeFile(workbook, "Report_Plasma_AFDS.xlsx");
  });

  document.getElementById('mailBtn').addEventListener('click', () => {
    const destinatari = "elias.rkibi@gmail.com,segreteria@afdsud.it,presidente@afdsud.it";
    const body = `Buongiorno,%0A%0AStatistiche attuali:%0A- Donatori: ${currentData.persone}%0A- Donazioni: ${currentData.donazioni}%0A- Totale: ${currentData.litri.toFixed(2).replace('.', ',')} litri%0A%0ADistinti saluti.`;
    window.location.href = `mailto:${destinatari}?subject=Report AFDS&body=${body}`;
  });

  document.getElementById('direttaBtn').addEventListener('click', () => { window.location.href = 'Diretta.html'; });
</script>
</body>
</html>
