<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Donazioni Plasma - AFDS</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  
  body { 
    font-family: Arial, sans-serif; 
    background: linear-gradient(135deg, #fff9c4, #fbc02d); 
    margin: 0; 
    padding: 0; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    height: 100vh; 
    overflow: hidden; 
    text-align: center; 
  }

  /* Loghi Superiori */
  .header-logo { height: 18vh; max-height: 150px; width: auto; margin-top: 2vh; }
  
  h1 { 
    margin: 1vh 0; 
    font-family: 'Pacifico', cursive; 
    font-size: clamp(1.8em, 4vw, 3em); 
    background: linear-gradient(45deg, #b8860b, #998a07); 
    -webkit-background-clip: text; 
    -webkit-text-fill-color: transparent; 
    font-weight: bold; 
  }
  
  .container { 
    display: flex; 
    justify-content: center; 
    flex-wrap: wrap; 
    gap: 1.5vw; 
    width: 95%; 
    max-width: 1100px; 
    margin: 2vh auto;
    flex: 1; 
    align-items: center;
  }

  .quadrant { 
    background-color: white; 
    padding: 2vh; 
    border-radius: 1em; 
    box-shadow: 0 0.5em 1em rgba(0,0,0,0.1); 
    min-width: 250px;
    flex: 1;
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
  }
  
  .title { font-weight: bold; font-size: 1.1em; margin-bottom: 5px; color: #555; }
  .value { display: flex; align-items: baseline; justify-content: center; gap: 0.3em; font-size: clamp(2.5em, 5vh, 3.5em); color: #2c3e50; font-weight: bold; }
  .unit { font-size: 0.5em; }

  /* Sezione Patrocini - Fascia intera */
  .sponsors-section { 
    width: 100%; 
    background-color: #ffffff; 
    padding: 2vh 20px 1vh 20px; 
    margin-top: auto; 
    box-shadow: 0 -4px 15px rgba(0,0,0,0.05); 
  }

  .logo-container-white {
    width: 100%;
    margin-bottom: 1vh;
  }
  
  .patrocinio-txt { 
    font-weight: bold; 
    font-size: 0.75em; 
    margin-bottom: 12px; 
    color: #444; 
    letter-spacing: 1px; 
  }
  
  /* Loghi distribuiti su tutto lo spazio */
  .logo-row-inline { 
    display: flex; 
    justify-content: space-evenly; 
    align-items: center; 
    flex-wrap: wrap; 
    gap: 2vw; 
    width: 100%;
    max-width: 1400px; 
    margin: 0 auto;
  }
  
  /* Dimensioni Loghi */
  .logo-img { height: clamp(55px, 7.5vh, 85px); width: auto; object-fit: contain; }
  .logo-fvg { height: clamp(48px, 6.5vh, 73px); } 
  .logo-xl { height: clamp(70px, 9.5vh, 115px); } /* Classe speciale per i due loghi richiesti */

  .footer-small { font-size: 0.7em; color: #777; margin-top: 8px; }

  @media (max-width: 900px) {
    body { overflow: auto; height: auto; }
    .container { flex-direction: column; }
    .header-logo { height: 120px; }
    .logo-row-inline { gap: 15px; justify-content: center; }
    .sponsors-section { padding: 15px 10px; }
  }
</style>
</head>
<body>

<img src="Logo 24ore giallo.png" alt="Logo 24 Ore" class="header-logo">

<h1>Giornata Mondiale del Dono del Sangue</h1>

<div class="container">
  <div class="quadrant">
    <div class="title">Numero Donatori</div>
    <div class="value" id="persone">0</div>
  </div>
  <div class="quadrant">
    <div class="title">Donazioni Plasma</div>
    <div class="value" id="donazioni">0</div>
  </div>
  <div class="quadrant">
    <div class="title">Plasma donato</div>
    <div class="value"><span id="litriNumero">0,00</span><span class="unit">litri</span></div>
    <div style="font-size:1em; margin-top:2px; color: #7f8c8d;">(<span id="millilitri">0</span> ml)</div>
  </div>
</div>

<div class="sponsors-section">
  <div class="logo-container-white">
    <div class="patrocinio-txt">CON IL PATROCINIO DI</div>
    
    <div class="logo-row-inline">
      <img src="EP_Logo Patronage_Europea_POS_RGB_IT.jpg" alt="Parlamento Europeo" class="logo-img logo-xl">
      <img src="Logo Regione autonoma FVG.png" alt="Regione FVG" class="logo-img logo-fvg">
      <img src="LOGOCRFVG.JPG" alt="Consiglio Regionale FVG" class="logo-img">
      <img src="logo stemma comune udine 2025.jpg" alt="Comune di Udine" class="logo-img">
      <img src="logo Città Sane Udine.jpg" alt="Città Sane" class="logo-img logo-xl">
      <img src="ASU FC FVG colore@4x.png" alt="ASU FC" class="logo-img">
    </div>
  </div>
  
  <div class="footer-small">Tutti i diritti sono riservati. AFDS Udine.</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA2tJ9eX3BZ9UkJa_ikglNesBgTejCSM2k",
    authDomain: "afds-24ore.firebaseapp.com",
    databaseURL: "https://afds-24ore-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "afds-24ore",
    storageBucket: "afds-24ore.firebasestorage.app",
    messagingSenderId: "1019493137119",
    appId: "1:1019493137119:web:e6dc7238513814a064876a",
    measurementId: "G-3N241MBCMR"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const dataRef = ref(db, 'stats');

  let oldP = 0, oldD = 0, oldL = 0, oldM = 0;

  onValue(dataRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
      animateIncrement('persone', oldP, data.persone);
      animateIncrement('donazioni', oldD, data.donazioni);
      animateIncrement('litriNumero', oldL, data.litri, true);
      animateIncrement('millilitri', oldM, data.milli);
      oldP = data.persone; oldD = data.donazioni; oldL = data.litri; oldM = data.milli;
    }
  });

  function animateIncrement(targetId, start, end, decimal = false) {
    const target = document.getElementById(targetId);
    if (!target) return;
    const duration = 800;
    const startTime = performance.now();
    function update(now) {
      const progress = Math.min((now - startTime) / duration, 1);
      const val = start + (end - start) * progress;
      target.textContent = decimal ? val.toFixed(2).replace('.', ',') : Math.round(val);
      if (progress < 1) requestAnimationFrame(update);
    }
    requestAnimationFrame(update);
  }
</script>
</body>
</html>
