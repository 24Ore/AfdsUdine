<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Donazioni Plasma - AFDS</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #fff9c4, #fbc02d); margin: 0; padding: 2vh 5vw; display: flex; flex-direction: column; align-items: center; min-height: 100vh; text-align: center; }
  h1 { margin-bottom: 2vh; font-family: 'Pacifico', cursive; font-size: clamp(2.5em, 8vw, 4em); background: linear-gradient(45deg, #b8860b, #998a07); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
  .container { display: flex; justify-content: center; flex-wrap: wrap; gap: 3vw; margin-top: 5vh; width: 100%; max-width: 1200px; }
  .quadrant { background-color: white; padding: 4vh 3vw; border-radius: 1em; box-shadow: 0 0.5em 1em rgba(0,0,0,0.1); width: min(90%, 300px); min-height: 25vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .title { font-weight: bold; font-size: 1.5em; margin-bottom: 1.2vh; color: #555; }
  .value { display: flex; align-items: baseline; justify-content: center; gap: 0.5em; font-size: 3.5em; color: #2c3e50; }
  .unit { font-size: 0.6em; }
  .footer-small { font-size: 0.9em; color: #555; margin-top: 10vh; }
</style>
</head>
<body>

<h1>Giornata del dono - 24 Ore</h1>

<div class="container">
  <div class="quadrant">
    <div class="title">Numero Donatori</div>
    <div class="value" id="persone">0</div>
  </div>
  <div class="quadrant">
    <div class="title">Donazioni Plasma</div>
    <div class="value" id="donazioni">0</div>
  </div>
  <div class="quadrant">
    <div class="title">Plasma donato</div>
    <div class="value"><span id="litriNumero">0,00</span><span class="unit">litri</span></div>
    <div style="font-size:1.2em; margin-top:1vh;">(<span id="millilitri">0</span> ml)</div>
  </div>
</div>

<div class="footer-small">Tutti i diritti sono riservati. AFDS Udine.</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA2tJ9eX3BZ9UkJa_ikglNesBgTejCSM2k",
    authDomain: "afds-24ore.firebaseapp.com",
    databaseURL: "https://afds-24ore-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "afds-24ore",
    storageBucket: "afds-24ore.firebasestorage.app",
    messagingSenderId: "1019493137119",
    appId: "1:1019493137119:web:e6dc7238513814a064876a",
    measurementId: "G-3N241MBCMR"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const dataRef = ref(db, 'stats');

  let oldP = 0, oldD = 0, oldL = 0, oldM = 0;

  onValue(dataRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
      animateIncrement('persone', oldP, data.persone);
      animateIncrement('donazioni', oldD, data.donazioni);
      animateIncrement('litriNumero', oldL, data.litri, true);
      animateIncrement('millilitri', oldM, data.milli);
      oldP = data.persone; oldD = data.donazioni; oldL = data.litri; oldM = data.milli;
    }
  });

  function animateIncrement(targetId, start, end, decimal = false) {
    const target = document.getElementById(targetId);
    const duration = 800;
    const startTime = performance.now();
    function update(now) {
      const progress = Math.min((now - startTime) / duration, 1);
      const val = start + (end - start) * progress;
      target.textContent = decimal ? val.toFixed(2).replace('.', ',') : Math.round(val);
      if (progress < 1) requestAnimationFrame(update);
    }
    requestAnimationFrame(update);
  }
</script>
</body>
</html>
