<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gestione Donazione Plasma - AFDS</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { 
    font-family: Arial, sans-serif; 
    /* Aggiornato a sfondo Giallo */
    background: linear-gradient(135deg, #fff9c4, #fbc02d); 
    margin: 0; 
    padding: 2vh 5vw; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    min-height: 100vh; 
    text-align: center; 
  }
  h1 { margin-bottom: 2vh; font-family: 'Pacifico', cursive; font-size: clamp(2.5em, 8vw, 4em); background: linear-gradient(45deg, #b8860b, #998a07); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
  
  .container { display: flex; justify-content: center; flex-wrap: wrap; gap: 3vw; margin-bottom: 4vh; width: 100%; max-width: 1200px; padding: 0 2vw; }
  .quadrant { background-color: white; padding: 3vh 3vw; border-radius: 1em; box-shadow: 0 0.5em 1em rgba(0,0,0,0.1); width: min(90%, 300px); min-height: 20vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .title { font-weight: bold; font-size: clamp(1em, 3vw, 1.5em); margin-bottom: 1.2vh; color: #555; }
  .value { display: flex; align-items: baseline; justify-content: center; gap: 0.5em; font-size: clamp(2em, 6vw, 3em); color: #2c3e50; }
  .unit { font-size: 0.6em; margin-left: 0.3em; }
  
  .buttons-container { display: flex; flex-direction: column; align-items: center; gap: 2vh; margin-top: 5vh; }
  
  #plasmaBtn { background-color: #b8860b; color: white; border: none; padding: 2vh 4vw; font-size: clamp(1.5em, 5vw, 2em); border-radius: 0.5em; cursor: pointer; transition: all 0.3s; font-family: 'Pacifico', cursive; box-shadow: 0 4px 15px rgba(184, 134, 11, 0.3); }
  #plasmaBtn:hover { background-color: #998a07; transform: scale(1.05); }

  #exportBtn { background-color: #2c3e50; color: white; border: none; padding: 1.5vh 3vw; font-size: 1.1em; border-radius: 0.5em; cursor: pointer; transition: all 0.3s; font-weight: bold; }
  #mailBtn { background-color: #2980b9; color: white; border: none; padding: 1.5vh 3vw; font-size: 1.1em; border-radius: 0.5em; cursor: pointer; transition: all 0.3s; font-weight: bold; }
  #mailBtn:hover { background-color: #3498db; transform: scale(1.05); }

  #direttaBtn { background-color: #8e44ad; color: white; border: none; padding: 1.5vh 3vw; font-size: 1.1em; border-radius: 0.5em; cursor: pointer; transition: all 0.3s; font-weight: bold; }
  #direttaBtn:hover { background-color: #9b59b6; transform: scale(1.05); }

  .bottom-actions { display: flex; align-items: center; gap: 20px; margin-top: 10px; }
  #reduceBtn { background: none; border: none; font-size: 1.8rem; cursor: pointer; transition: transform 0.2s; padding: 5px; }
  #reduceBtn:hover { transform: scale(1.2); }
  #resetBtn { background-color: #c0392b; color: white; border: none; padding: 1vh 2vw; font-size: 0.9em; border-radius: 0.5em; cursor: pointer; transition: all 0.3s; font-weight: bold; opacity: 0.8; }
  #resetBtn:hover { background-color: #e74c3c; opacity: 1; transform: scale(1.02); }

  .footer-small { font-size: clamp(0.7em, 2vw, 0.9em); color: #555; margin-top: 5vh; }
</style>
</head>
<body>

<h1>Pannello Gestione Plasma</h1>

<div class="container">
  <div class="quadrant"><div class="title">Numero Donatori</div><div class="value" id="persone">0</div></div>
  <div class="quadrant"><div class="title">Donazioni Plasma</div><div class="value" id="donazioni">0</div></div>
  <div class="quadrant">
    <div class="title">Plasma donato</div>
    <div class="value"><span id="litriNumero">0,00</span><span class="unit">litri</span></div>
    <div style="font-size:1em; margin-top:1vh;">(<span id="millilitri">0</span> ml)</div>
  </div>
</div>

<div class="buttons-container">
  <button id="plasmaBtn">DONA PLASMA</button>
  
  <div style="display: flex; gap: 10px;">
    <button id="exportBtn" title="Scarica Excel">📥</button>
    <button id="mailBtn" title="Invia Email">✉️</button>
    <button id="direttaBtn" title="Vai alla Diretta">📺</button>
  </div>
  
  <div class="bottom-actions">
    <button id="reduceBtn" title="Riduci di 1 donazione">😊</button>
    <button id="resetBtn">🔄</button>
  </div>
</div>

<div class="footer-small">Tutti i diritti sono riservati. AFDS Udine.</div>

<script>
  let personeCount = parseFloat(localStorage.getItem('plasma_persone')) || 0;
  let donazioniCount = parseFloat(localStorage.getItem('plasma_donazioni')) || 0;
  let litriCount = parseFloat(localStorage.getItem('plasma_litri')) || 0;
  let millilitriCount = parseFloat(localStorage.getItem('plasma_milli')) || 0;

  updateUI();

  function updateUI() {
    document.getElementById('persone').textContent = personeCount;
    document.getElementById('donazioni').textContent = donazioniCount;
    document.getElementById('litriNumero').textContent = litriCount.toFixed(2).replace('.', ',');
    document.getElementById('millilitri').textContent = millilitriCount;
  }

  function animateIncrement(targetSpan, startValue, endValue, duration, isDecimal=false) {
    const startTime = performance.now();
    function update(currentTime) {
      const elapsed = currentTime - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const currentValue = startValue + (endValue - startValue) * progress;
      targetSpan.textContent = isDecimal ? currentValue.toFixed(2).replace('.', ',') : Math.round(currentValue);
      if (progress < 1) requestAnimationFrame(update);
    }
    requestAnimationFrame(update);
  }

  document.getElementById('plasmaBtn').addEventListener('click', () => {
    const nuovoLitri = litriCount + 0.75;
    const nuovoMillilitri = millilitriCount + 750;
    const nuovoPersone = personeCount + 1;
    const nuovoDonazioni = donazioniCount + 1;

    animateIncrement(document.getElementById('litriNumero'), litriCount, nuovoLitri, 300, true);
    animateIncrement(document.getElementById('millilitri'), millilitriCount, nuovoMillilitri, 300);
    animateIncrement(document.getElementById('persone'), personeCount, nuovoPersone, 300);
    animateIncrement(document.getElementById('donazioni'), donazioniCount, nuovoDonazioni, 300);

    litriCount = nuovoLitri; millilitriCount = nuovoMillilitri; personeCount = nuovoPersone; donazioniCount = nuovoDonazioni;
    saveToStorage();
  });

  document.getElementById('reduceBtn').addEventListener('click', () => {
    if (donazioniCount > 0) {
      if (confirm("Vuoi rimuovere l'ultima donazione inserita?")) {
        personeCount = Math.max(0, personeCount - 1);
        donazioniCount = Math.max(0, donazioniCount - 1);
        litriCount = Math.max(0, litriCount - 0.75);
        millilitriCount = Math.max(0, millilitriCount - 750);
        updateUI();
        saveToStorage();
      }
    } else {
      alert("Nessun dato da rimuovere.");
    }
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm("ATTENZIONE: Sei sicuro di voler azzerare tutti i dati del plasma?")) {
      personeCount = 0; donazioniCount = 0; litriCount = 0; millilitriCount = 0;
      updateUI();
      saveToStorage();
    }
  });

  document.getElementById('mailBtn').addEventListener('click', () => {
    const dataOra = new Date().toLocaleString('it-IT');
    const destinatario = "elias.rkibi@gmail.com";
    const oggetto = encodeURIComponent(`Report Plasma AFDS - ${dataOra}`);
    const corpo = encodeURIComponent(
      `Riepilogo Donazioni Plasma aggiornato:\n\n` +
      `• Data Report: ${dataOra}\n` +
      `• Numero Donatori: ${personeCount}\n` +
      `• Donazioni Effettuate: ${donazioniCount}\n` +
      `• Totale Plasma: ${litriCount.toFixed(2).replace('.', ',')} litri (${millilitriCount} ml)\n\n` +
      `Cordiali saluti.`
    );
    window.location.href = `mailto:${destinatario}?subject=${oggetto}&body=${corpo}`;
  });

  document.getElementById('direttaBtn').addEventListener('click', () => {
    window.location.href = 'Diretta.html';
  });

  function saveToStorage() {
    localStorage.setItem('plasma_litri', litriCount);
    localStorage.setItem('plasma_milli', millilitriCount);
    localStorage.setItem('plasma_persone', personeCount);
    localStorage.setItem('plasma_donazioni', donazioniCount);
    localStorage.setItem('plasma_update', Date.now());
  }

  document.getElementById('exportBtn').addEventListener('click', () => {
    const dataOra = new Date().toLocaleString('it-IT');
    const reportData = [
      ["REPORT PLASMA", ""], ["Data", dataOra], [""], 
      ["Categoria", "Valore"], ["Donatori", personeCount], 
      ["Donazioni", donazioniCount], ["Litri", litriCount.toFixed(2)], ["ml", millilitriCount]
    ];
    const worksheet = XLSX.utils.aoa_to_sheet(reportData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Dati");
    XLSX.writeFile(workbook, "Report_Plasma_AFDS.xlsx");
  });
</script>
</body>
</html>
