<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gestione Donazione Plasma - AFDS</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #fff9c4, #fbc02d); margin: 0; padding: 2vh 5vw; display: flex; flex-direction: column; align-items: center; min-height: 100vh; text-align: center; }
  h1 { margin-bottom: 2vh; font-family: 'Pacifico', cursive; font-size: clamp(2.5em, 8vw, 4em); background: linear-gradient(45deg, #b8860b, #998a07); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
  .container { display: flex; justify-content: center; flex-wrap: wrap; gap: 3vw; margin-bottom: 4vh; width: 100%; max-width: 1200px; padding: 0 2vw; }
  .quadrant { background-color: white; padding: 3vh 3vw; border-radius: 1em; box-shadow: 0 0.5em 1em rgba(0,0,0,0.1); width: min(90%, 300px); min-height: 20vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .title { font-weight: bold; font-size: clamp(1em, 3vw, 1.5em); margin-bottom: 1.2vh; color: #555; }
  .value { display: flex; align-items: baseline; justify-content: center; gap: 0.5em; font-size: clamp(2em, 6vw, 3em); color: #2c3e50; }
  .unit { font-size: 0.6em; margin-left: 0.3em; }
  .buttons-container { display: flex; flex-direction: column; align-items: center; gap: 2vh; margin-top: 5vh; }
  #plasmaBtn { background-color: #b8860b; color: white; border: none; padding: 2vh 4vw; font-size: clamp(1.5em, 5vw, 2em); border-radius: 0.5em; cursor: pointer; transition: all 0.3s; font-family: 'Pacifico', cursive; box-shadow: 0 4px 15px rgba(184, 134, 11, 0.3); }
  #plasmaBtn:hover { background-color: #998a07; transform: scale(1.05); }
  #exportBtn { background-color: #2c3e50; color: white; border: none; padding: 1.5vh 3vw; font-size: 1.1em; border-radius: 0.5em; cursor: pointer; transition: all 0.3s; font-weight: bold; }
  #mailBtn { background-color: #2980b9; color: white; border: none; padding: 1.5vh 3vw; font-size: 1.1em; border-radius: 0.5em; cursor: pointer; transition: all 0.3s; font-weight: bold; }
  #direttaBtn { background-color: #8e44ad; color: white; border: none; padding: 1.5vh 3vw; font-size: 1.1em; border-radius: 0.5em; cursor: pointer; transition: all 0.3s; font-weight: bold; }
  .bottom-actions { display: flex; align-items: center; gap: 20px; margin-top: 10px; }
  #reduceBtn { background: none; border: none; font-size: 1.8rem; cursor: pointer; transition: transform 0.2s; padding: 5px; }
  #resetBtn { background-color: #c0392b; color: white; border: none; padding: 1vh 2vw; font-size: 0.9em; border-radius: 0.5em; cursor: pointer; transition: all 0.3s; font-weight: bold; opacity: 0.8; }
  .footer-small { font-size: clamp(0.7em, 2vw, 0.9em); color: #555; margin-top: 5vh; }
</style>
</head>
<body>

<h1>Pannello Gestione Plasma</h1>

<div class="container">
  <div class="quadrant"><div class="title">Numero Donatori</div><div class="value" id="persone">0</div></div>
  <div class="quadrant"><div class="title">Donazioni Plasma</div><div class="value" id="donazioni">0</div></div>
  <div class="quadrant">
    <div class="title">Plasma donato</div>
    <div class="value"><span id="litriNumero">0,00</span><span class="unit">litri</span></div>
    <div style="font-size:1em; margin-top:1vh;">(<span id="millilitri">0</span> ml)</div>
  </div>
</div>

<div class="buttons-container">
  <button id="plasmaBtn">DONA PLASMA</button>
  <div style="display: flex; gap: 10px;">
    <button id="exportBtn" title="Scarica Excel">📥</button>
    <button id="mailBtn" title="Invia Email">✉️</button>
    <button id="direttaBtn" title="Vai alla Diretta">📺</button>
  </div>
  <div class="bottom-actions">
    <button id="reduceBtn" title="Riduci di 1 donazione">😊</button>
    <button id="resetBtn">🔄</button>
  </div>
</div>

<div class="footer-small">Tutti i diritti sono riservati. AFDS Udine.</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA2tJ9eX3BZ9UkJa_ikglNesBgTejCSM2k",
    authDomain: "afds-24ore.firebaseapp.com",
    databaseURL: "https://afds-24ore-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "afds-24ore",
    storageBucket: "afds-24ore.firebasestorage.app",
    messagingSenderId: "1019493137119",
    appId: "1:1019493137119:web:e6dc7238513814a064876a",
    measurementId: "G-3N241MBCMR"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const dataRef = ref(db, 'stats');

  let currentData = { persone: 0, donazioni: 0, litri: 0, milli: 0 };

  onValue(dataRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
      currentData = data;
      updateUI();
    }
  });

  function updateUI() {
    document.getElementById('persone').textContent = currentData.persone;
    document.getElementById('donazioni').textContent = currentData.donazioni;
    document.getElementById('litriNumero').textContent = currentData.litri.toFixed(2).replace('.', ',');
    document.getElementById('millilitri').textContent = currentData.milli;
  }

  document.getElementById('plasmaBtn').addEventListener('click', () => {
    set(dataRef, {
      persone: currentData.persone + 1,
      donazioni: currentData.donazioni + 1,
      litri: currentData.litri + 0.75,
      milli: currentData.milli + 750
    });
  });

  document.getElementById('reduceBtn').addEventListener('click', () => {
    if (currentData.donazioni > 0 && confirm("Rimuovere l'ultima donazione?")) {
      set(dataRef, {
        persone: Math.max(0, currentData.persone - 1),
        donazioni: Math.max(0, currentData.donazioni - 1),
        litri: Math.max(0, currentData.litri - 0.75),
        milli: Math.max(0, currentData.milli - 750)
      });
    }
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm("Azzerare tutto?")) {
      set(dataRef, { persone: 0, donazioni: 0, litri: 0, milli: 0 });
    }
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    const reportData = [["REPORT PLASMA"], ["Donatori", currentData.persone], ["Donazioni", currentData.donazioni], ["Litri", currentData.litri.toFixed(2)]];
    const worksheet = XLSX.utils.aoa_to_sheet(reportData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Dati");
    XLSX.writeFile(workbook, "Report_Plasma_AFDS.xlsx");
  });

  document.getElementById('mailBtn').addEventListener('click', () => {
    window.location.href = `mailto:elias.rkibi@gmail.com?subject=Report&body=Totale: ${currentData.litri.toFixed(2)} litri`;
  });

  document.getElementById('direttaBtn').addEventListener('click', () => { window.location.href = 'Diretta.html'; });
</script>
</body>
</html>
